name: ci

# 质量门禁：PR 与推送到 main 时运行。发布流程（release.yml）只在打 tag 时触发，
# 不跑测试；这里补上测试、静态检查与前端构建。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # golangci-lint only-new-issues 读取 PR diff

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (vet + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # 未配置数据库：依赖 Postgres 的测试会自行跳过（见 server/testmain_test.go 的
      # requireTestPG 与 db 包的 testDSN），其余单元测试全部运行。
      - run: go test -count=1 ./...

  go-db:
    name: go (Postgres tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
      # 已知失败、待修复的测试（在引入 CI 之前就失败，与时区无关）。修好后从这里移除：
      #   db:    TestInterceptApprovalFilters、TestSideTaskArchiveVersions
      #   agent: TestGraphOverviewExpandsAssociatedCompanyScope、TestCaptureApprovalLifecycle
      KNOWN_FAILING: ^(TestInterceptApprovalFilters|TestSideTaskArchiveVersions|TestGraphOverviewExpandsAssociatedCompanyScope|TestCaptureApprovalLifecycle)$
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -p 1：db/agent/server 共用一个库，TestMain 里的 advisory lock 已串行化，
      # 这里再避免其它包并发抢 CPU。
      - run: go test -count=1 -p 1 -skip "$KNOWN_FAILING" ./db ./agent ./server

  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # 仓库现有约 90 条历史告警；只拦截本次改动新引入的问题。
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          only-new-issues: true
          args: --timeout=10m

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # biome --changed 需要与基准分支比较
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # 与 release.yml 的前端构建一致
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      # 现有代码约有 100 条历史 biome 错误，暂不阻塞：只检查本次改动过的文件并给出告警。
      # 清理完历史问题后去掉 continue-on-error 即可变为强制。
      - name: biome (changed files)
        continue-on-error: true
        run: npx biome ci --changed --since=origin/${{ github.base_ref || 'main' }} --no-errors-on-unmatched
      - run: npm run build:static
